<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source for docs/og.png, the image shown in link previews. Rebuild with: node web/make-og.js -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #eef3f7; color: #0d1b2a; overflow: hidden; }
  body { font-family: "Big Shoulders Display", "Arial Narrow", Arial, sans-serif; padding: 64px 72px; box-sizing: border-box; display: grid; align-content: space-between; }
  .eyebrow { font: 500 22px "IBM Plex Mono", monospace; letter-spacing: .12em; color: #566778; display: flex; gap: 16px; align-items: center; }
  .eyebrow::before { content: ""; width: 48px; height: 5px; background: #1d4f9e; }
  h1 { font-weight: 900; font-size: 132px; line-height: .88; margin: 0; text-transform: uppercase; }
  h1 span { color: #c8102e; }
  .chain { display: flex; align-items: center; gap: 0; font-weight: 800; font-size: 30px; text-transform: uppercase; }
  .chain b { background: #fff; border: 2px solid #d3dde6; border-radius: 10px; padding: 10px 16px; white-space: nowrap; }
  .chain b.end { background: #c8102e; border-color: #c8102e; color: #fff; }
  .chain i { flex: 1; height: 5px; background: #c8102e; min-width: 18px; }
</style></head>
<body>
  <div class="eyebrow">EVERY NHL ROSTER, 1917–18 TO TODAY</div>
  <h1>NHL Player<br><span>Connections</span></h1>
  <div class="chain"><b class="end">Bedard</b><i></i><b>Perry</b><i></i><b>Schneider</b><i></i><b>Robinson</b><i></i><b>Henri Richard</b><i></i><b class="end">Rocket Richard</b></div>
</body></html>
